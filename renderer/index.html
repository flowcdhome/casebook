<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Casebook</title>
<style>
:root{--bg:#121212;--panel:#181818;--line:#2a2a2a;--text:#e8e4dc;--dim:#8a867e;--ac:#d9a441;--mono:"JetBrains Mono","DejaVu Sans Mono",monospace}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{display:grid;grid-template-columns:230px 1fr;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,"Inter",sans-serif;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:1px solid var(--line);padding:5px 11px;cursor:pointer;transition:border-color .15s,color .15s,background .15s}
button:hover:not(:disabled){border-color:var(--ac);color:var(--ac)}
button:disabled{opacity:.4;cursor:default}
button.pri{background:var(--ac);color:#121212;border-color:var(--ac)}button.pri:hover{filter:brightness(1.1);color:#121212}
input,select,textarea{background:var(--panel);border:1px solid var(--line);padding:6px 9px;outline:0;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}
:focus-visible{outline:1px solid var(--ac);outline-offset:1px}
textarea{width:100%;resize:vertical;min-height:90px;font-family:var(--mono);font-size:13px}
#side{border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:6px;overflow:auto}
.logo{font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:12px;color:var(--dim);margin-bottom:10px}
.case{text-align:left;border:0;border-left:2px solid transparent;padding:7px 10px;color:var(--dim);width:100%}
.case.on{border-left-color:var(--ac);color:var(--text);background:var(--panel)}
.sp{flex:1}
#main{overflow:auto;padding:22px 28px}
.banner{background:#2a1c1c;border:1px solid #5a2f2f;padding:8px 12px;margin-bottom:14px;color:#e0b0b0}
.bar{display:flex;gap:10px;align-items:center;margin-bottom:16px}
.title{font-size:22px;font-weight:600;background:none;border:0;border-bottom:1px solid transparent;flex:1;padding:2px 0}
.title:focus,.title:hover{border-bottom-color:var(--line)}
.tabs{display:flex;gap:18px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tab{border:0;border-bottom:2px solid transparent;padding:6px 0;color:var(--dim)}.tab.on{color:var(--text);border-bottom-color:var(--ac)}
.cols{display:grid;grid-template-columns:300px 1fr;gap:24px}
.add{display:flex;gap:6px;margin-bottom:12px}.add input{flex:1;min-width:0}
.lead{display:flex;gap:8px;align-items:baseline;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);padding:8px 4px;animation:in .18s ease-out}
.lead.on{background:var(--panel);box-shadow:inset 2px 0 var(--ac)}
.tag{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;min-width:56px}
.val{font-family:var(--mono);word-break:break-all}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);font-weight:600;margin:20px 0 8px}
.row{display:flex;gap:8px;align-items:center;padding:4px 0;border-bottom:1px solid var(--line);animation:in .18s ease-out}
.row .val{flex:1}.row button{padding:2px 8px;font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
pre{background:var(--panel);border:1px solid var(--line);padding:8px;font:12px/1.4 var(--mono);max-height:140px;overflow:auto;white-space:pre-wrap;margin-top:8px}
.dim{color:var(--dim)}.empty{margin:18vh auto;text-align:center;max-width:360px;display:grid;gap:14px}
table{border-collapse:collapse;width:100%;max-width:640px}td{padding:4px 8px 4px 0;border-bottom:1px solid var(--line)}td:first-child{color:var(--dim)}
.bk{font-family:var(--mono);font-size:12px;min-width:150px;text-align:left}
.sw{display:flex;gap:8px;margin:8px 0;align-items:center}.sw button{width:26px;height:26px;padding:0;border-radius:50%}.sw button.on{outline:2px solid var(--text)}

/* оверлеи: обучение, палитра, меню, уведомления */
#ov{position:fixed;inset:0;background:rgba(0,0,0,.72);display:grid;place-items:center;animation:fade .2s}
#ov[hidden]{display:none}
.card{background:var(--panel);border:1px solid var(--line);padding:26px;width:min(520px,90vw);display:grid;gap:12px;animation:in .22s ease-out}
.card h2{font-size:18px}.card p{color:var(--dim)}.card .nav{display:flex;justify-content:space-between;align-items:center}
.pal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;justify-content:center;padding-top:14vh;z-index:50}
.palbox{width:min(560px,92vw);background:var(--panel);border:1px solid var(--line);align-self:flex-start;animation:in .15s ease-out}
.palbox input{width:100%;border:0;border-bottom:1px solid var(--line);padding:12px 14px;font-size:15px}
.palit{display:flex;justify-content:space-between;width:100%;text-align:left;border:0;padding:8px 14px}
.palit.on{background:#222;box-shadow:inset 2px 0 var(--ac)}.palit i{font-style:normal;color:var(--dim);font-size:12px}
.cmenu{position:fixed;z-index:60;min-width:210px;background:var(--panel);border:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.5);padding:4px;animation:in .12s ease-out}
.cit{display:flex;justify-content:space-between;gap:24px;width:100%;text-align:left;border:0;padding:6px 10px}
.cit:hover:not(:disabled),.cit:focus{background:#222;color:var(--text)}.cit i{font-style:normal;color:var(--dim);font-size:12px}
.csep{height:1px;background:var(--line);margin:4px 0}
.cswa{display:flex;gap:6px;padding:6px 10px}.cswa button{width:20px;height:20px;padding:0;border-radius:50%}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(8px);background:var(--panel);border:1px solid var(--ac);padding:7px 14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:70}
.toast.on{opacity:1;transform:translateX(-50%)}

/* холст */
.btool{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.btool .hint{color:var(--dim);font-size:12px;margin-left:8px}
.bd{position:relative;height:calc(100vh - 205px);min-height:360px;overflow:hidden;border:1px solid var(--line);background-color:var(--bg);background-image:radial-gradient(#2a2a2a 1px,transparent 1px);background-size:24px 24px;user-select:none}
.bw{position:absolute;left:0;top:0;transform-origin:0 0}
.bn{position:absolute;min-width:90px;max-width:340px;background:var(--panel);border:1px solid #3a3a3a;border-left:4px solid var(--stripe,#3a3a3a);padding:8px 12px;cursor:move;user-select:none;animation:in .15s ease-out}
.bn.sel{border-color:var(--ac);border-left-color:var(--stripe,var(--ac))}
.bn.cand{outline:2px dashed var(--ac);outline-offset:3px}
.bn .t{outline:0;white-space:pre-wrap;word-break:break-word;min-height:1.4em}
.bn .t:empty:before{content:'Текст…';color:var(--dim)}
.bn.im .t:empty{display:none}
.bn img{display:block;max-width:300px;max-height:300px;margin-bottom:4px}
.bh{position:absolute;right:-7px;top:50%;margin-top:-6px;width:12px;height:12px;border-radius:50%;background:var(--ac);opacity:0;cursor:crosshair;transition:opacity .12s}
.bn:hover .bh,.bn.sel .bh{opacity:1}
.bl{position:absolute;width:120px;z-index:5;background:var(--panel);border:1px solid var(--ac);padding:3px 6px;font-size:12px}
.rb{position:absolute;border:1px solid var(--ac);background:rgba(217,164,65,.08);pointer-events:none}

@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<aside id="side"></aside><main id="main"></main><div id="ov" hidden></div>
<script src="lib.js"></script><script src="board.js"></script><script src="app.js"></script>
</body></html>
